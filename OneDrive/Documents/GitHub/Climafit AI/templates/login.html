<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ClimaFit AI</title>
    <meta name="description"
        content="Login to ClimaFit AI - Your personal climate-based fashion intelligence assistant.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='animations.css') }}">
</head>

<body>
    <div class="background-mesh">
        <div class="mesh-shape shape-1"></div>
        <div class="mesh-shape shape-2"></div>
        <div class="mesh-shape shape-3"></div>

        <!-- Floating Particles -->
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="brand-header">
                <img src="{{ url_for('static', filename='climafit_logo.png') }}" alt="ClimaFit AI Logo"
                    class="brand-logo">
                <h1>ClimaFit AI</h1>
                <p class="subtitle">Fashion adapted to your world</p>
            </div>

            <form method="POST" class="login-form">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required
                        autocomplete="email">
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required
                        autocomplete="current-password">
                </div>

                <div class="forgot-password-link" style="text-align: center; margin-bottom: 15px;">
                    <a href="{{ url_for('forgot_password') }}"
                        style="color: #afb1ab; text-decoration: none; font-size: 0.9em; transition: color 0.3s;">
                        Forgot Password?
                    </a>
                </div>

                <button type="submit" class="btn-primary">
                    <span>Sign In</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <path d="M12 5L19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </button>

                {% if error %}
                <div class="error-message">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <span>{{ error }}</span>
                </div>
                {% endif %}
            </form>

            <div class="form-footer">
                <p>New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
            </div>
        </div>
    </div>
</body>

</html>
