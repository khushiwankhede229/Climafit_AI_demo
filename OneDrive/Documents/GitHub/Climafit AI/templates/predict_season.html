<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Season Recommender - ClimaFit AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            color: #ccc;
            margin-bottom: 5px;
            font-weight: bold;
        }

        select,
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #222;
            color: white;
        }

        .result-box {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 183, 3, 0.2);
            border: 1px solid #ffb703;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <header>
        <h1>Season Recommender</h1>
        <nav>
            <a href="{{ url_for('predict_hub') }}">Back to Hub</a>
        </nav>
    </header>

    <div class="container"
        style="max-width: 600px; margin: 40px auto; background: #1a1a1a; padding: 30px; border-radius: 15px;">
        <form method="POST" action="{{ url_for('predict_season') }}">
            <div class="form-group">
                <label>Fabric Material</label>
                <select name="fabric" required>
                    {% for f in fabrics %}
                    <option value="{{ f }}">{{ f }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Gender Category</label>
                <select name="gender" required>
                    {% for g in genders %}
                    <option value="{{ g }}">{{ g }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>State (Optional)</label>
                <select id="state" name="state" onchange="populateDistricts()">
                    <option value="">Select State</option>
                </select>
            </div>

            <div class="form-group">
                <label>District (Optional)</label>
                <select id="district" name="district">
                    <option value="">Select District</option>
                </select>
            </div>

            <button type="submit" class="nav-btn"
                style="width: 100%; background: #ffb703; color: #1e2a38; font-weight: bold; font-size: 1.1em;">Find Best
                Season</button>
        </form>

        {% if prediction %}
        <div class="result-box" style="text-align: center;">
            <h3 style="color: #fff; margin:0;">Recommended Season</h3>
            <div style="font-size: 3em; color: #ffb703; font-weight: bold; margin: 10px 0;">{{ prediction }}</div>
            <p style="color: #aaa;">This fabric is most commonly worn during {{ prediction }}.</p>
        </div>
        {% endif %}

        {% if error %}
        <div class="result-box" style="border-color: red; background: rgba(255,0,0,0.1);">
            <p style="color: #ff6b6b;">{{ error }}</p>
        </div>
        {% endif %}
    </div>

    <script>
        // Load Indian States and Districts
        let indianStates = {};

        // Fetch the JSON file
        fetch("{{ url_for('static', filename='indian_states.json') }}")
            .then(response => response.json())
            .then(data => {
                indianStates = data;
                populateStates();
            })
            .catch(error => console.error('Error loading states:', error));

        // Populate the state dropdown
        function populateStates() {
            const stateSelect = document.getElementById('state');
            if (!stateSelect) return;

            // Clear existing options except the first one
            stateSelect.innerHTML = '<option value="">Select State</option>';

            // Add all states
            Object.keys(indianStates).sort().forEach(state => {
                const option = document.createElement('option');
                option.value = state;
                option.textContent = state;
                stateSelect.appendChild(option);
            });
        }

        // Populate districts based on selected state
        function populateDistricts() {
            const stateSelect = document.getElementById('state');
            const districtSelect = document.getElementById('district');

            if (!stateSelect || !districtSelect) return;

            const selectedState = stateSelect.value;

            // Clear district dropdown
            districtSelect.innerHTML = '<option value="">Select District</option>';

            if (selectedState && indianStates[selectedState]) {
                // Add districts for the selected state
                indianStates[selectedState].forEach(district => {
                    const option = document.createElement('option');
                    option.value = district;
                    option.textContent = district;
                    districtSelect.appendChild(option);
                });
            }
        }
    </script>
</body>

</html>
